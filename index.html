let needleImg;

// Needle tracking for piercing mechanic
let prevMouseX = 0;
let prevMouseY = 0;
let needleSpeed = 0;
let mouseDownTime = 0;

// Needle rotation tracking
let prevNeedleX = 0;
let prevNeedleY = 0;
let needleAngle = 0;
let targetNeedleAngle = 0;
let angleSmoothing = 0.08; // Lower = smoother, higher = more responsive

// Needle dimensions for positioning
let needleLength = 40; // Distance from center to tip

// Thread physics
let threadSegments = [];
let numThreadSegments = 8;
let segmentLength = 20;

// Needle control
let needleFollowsMouse = false;
let fixedNeedleX = 0;
let fixedNeedleY = 0;

// Drag-through sewing variables
let isDragging = false;
let dragStartX = 0, dragStartY = 0;
let dragPath = []; // Track the path of dragging for through-detection
let dragMinDistance = 30; // Minimum drag distance to count as "through"

function preload() {
  needleImg = loadImage('data:image/png;base64,' + base64Needle);
}

function setup() {
  createCanvas(windowWidth, windowHeight);
  centerX = width / 2;
  centerY = height / 2;

  // Generate stitches in heart shape
  let size = 15;
  let heartBottomY = centerY;
  
  for (let t = 0; t < TWO_PI; t += TWO_PI / 40) {
    let x = size * 16 * pow(sin(t), 3);
    let y = -size * (13 * cos(t) - 5 * cos(2 * t) - 2 * cos(3 * t) - cos(4 * t));
    
    // Track the bottom of the heart
    if (centerY + y > heartBottomY) {
      heartBottomY = centerY + y;
    }
    
    // Calculate tangent angle for stitch orientation
    let dx = size * 16 * 3 * pow(sin(t), 2) * cos(t);
    let dy = -size * (-13 * sin(t) + 10 * sin(2 * t) + 6 * sin(3 * t) + 4 * sin(4 * t));
    let angle = atan2(dy, dx);
    
    stitches.push({ x: centerX + x, y: centerY + y, angle: angle, done: false });
  }
  
  console.log("Generated", stitches.length, "stitches");
  
  // Position initial needle position at bottom of heart
  fixedNeedleX = centerX;
  fixedNeedleY = heartBottomY + 50; // Slightly below the heart
  needleFollowsMouse = false; // Start with needle fixed (ESC mode enabled)
  
  // Initialize needle tracking variables
  prevNeedleX = fixedNeedleX;
  prevNeedleY = fixedNeedleY;
  needleAngle = 0; // Start pointing horizontally to the right
  targetNeedleAngle = 0;
  prevMouseX = mouseX;
  prevMouseY = mouseY;
  
  // Show mouse cursor since needle is fixed
  document.body.style.cursor = 'default';
  
  // Initialize thread segments (will be positioned relative to mouse)
  for (let i = 0; i < numThreadSegments; i++) {
    threadSegments.push({
      x: centerX,
      y: centerY + i * segmentLength,
      prevX: centerX,
      prevY: centerY + i * segmentLength
    });
  }
}

function updateNeedleSpeed() {
  needleSpeed = dist(mouseX, mouseY, prevMouseX, prevMouseY);
  
  // Calculate mouse movement direction for needle angle
  let mouseDeltaX = mouseX - prevMouseX;
  let mouseDeltaY = mouseY - prevMouseY;
  
  // Calculate needle angle based on mouse movement direction
  let newTargetAngle;
  
  if (abs(mouseDeltaX) > 1.0 || abs(mouseDeltaY) > 1.0) {
    // Use movement direction when mouse is moving
    newTargetAngle = atan2(mouseDeltaY, mouseDeltaX);
  } else {
    // When not moving much, keep current target angle
    newTargetAngle = targetNeedleAngle;
  }
  
  // Handle angle wrapping (shortest path between angles)
  let targetAngleDiff = newTargetAngle - targetNeedleAngle;
  
  // Normalize angle difference to [-PI, PI]
  while (targetAngleDiff > PI) targetAngleDiff -= TWO_PI;
  while (targetAngleDiff < -PI) targetAngleDiff += TWO_PI;
  
  targetNeedleAngle += targetAngleDiff;
  
  // Smoothly interpolate toward target angle with easing
  let currentAngleDiff = targetNeedleAngle - needleAngle;
  
  // Normalize angle difference to [-PI, PI] for smooth interpolation
  while (currentAngleDiff > PI) currentAngleDiff -= TWO_PI;
  while (currentAngleDiff < -PI) currentAngleDiff += TWO_PI;
  
  // Use eased interpolation for even smoother movement
  let easedSmoothing = angleSmoothing * (1 - Math.pow(1 - Math.abs(currentAngleDiff) / PI, 2));
  needleAngle += currentAngleDiff * easedSmoothing;
  
  prevMouseX = mouseX;
  prevMouseY = mouseY;
}

function drawSewnPath() {
  stroke("red");
  strokeWeight(2);
  noFill();

  beginShape();
  for (let p of sewnPath) {
    vertex(p.x, p.y);
  }

  // Connect last sewn stitch to needle eye
  let { x: needleX, y: needleY } = getCurrentNeedleEyePos();
  vertex(needleX, needleY);

  endShape();

  // Draw dangling thread from first stitch
  let firstPoint = sewnPath[0];
  drawPureDanglingThread(firstPoint.x, firstPoint.y);
}

function drawInitialDanglingThread() {
  // Thread dangles from needle before any stitches
  let { x: needleX, y: needleY } = getCurrentNeedleEyePos();
  drawDanglingThread(needleX, needleY);
}

function drawStitches() {
  for (let s of stitches) {
    stroke(s.done ? "red" : "#ddd");
    strokeWeight(3);

    let angle = s.angle || 0;
    let lineLength = 12;
    line(
      s.x - cos(angle) * lineLength / 2, s.y - sin(angle) * lineLength / 2,
      s.x + cos(angle) * lineLength / 2, s.y + sin(angle) * lineLength / 2
    );
  }
}

function drawCompletionMessage() {
  fill("red");
  textAlign(CENTER, CENTER);
  textSize(48);
  textStyle(BOLD);
  text("i lob you", centerX, centerY);
}

function getNeedleCenterFromTip(tipX, tipY) {
  // Calculate needle center position from tip position
  // Tip is at the front, so center is needleLength/2 back from tip
  let centerX = tipX - cos(needleAngle) * (needleLength / 2);
  let centerY = tipY - sin(needleAngle) * (needleLength / 2);
  return { x: centerX, y: centerY };
}

function getCurrentNeedleEyePos() {
  let tipX = needleFollowsMouse ? mouseX : fixedNeedleX;
  let tipY = needleFollowsMouse ? mouseY : fixedNeedleY;
  
  // Calculate center from tip position
  let { x: centerX, y: centerY } = getNeedleCenterFromTip(tipX, tipY);
  
  return getNeedleEyePosition(centerX, centerY);
}

function draw() {
  background('#fffaf8');

  updateNeedleSpeed();
  updateThreadPhysics();

  if (sewnPath.length > 0) {
    drawSewnPath();
  } else {
    drawInitialDanglingThread();
  }

  drawStitches();

  // Draw needle (cursor is at tip, so calculate center position)
  let tipX = needleFollowsMouse ? mouseX : fixedNeedleX;
  let tipY = needleFollowsMouse ? mouseY : fixedNeedleY;
  let { x: needleCenterX, y: needleCenterY } = getNeedleCenterFromTip(tipX, tipY);
  drawNeedle(needleCenterX, needleCenterY);

  if (heartCompleted) {
    drawCompletionMessage();
  }
}

function drawNeedle(x, y) {
  push();
  translate(x, y);
  rotate(needleAngle);
  
  // Draw needle using the loaded image
  if (needleImg) {
    // The needle image is vertical by default, so we need to rotate it to horizontal
    rotate(-PI/2); // Rotate -90 degrees to make it horizontal
    
    // Draw the needle image centered at the current position
    // Scale it down to appropriate size (adjust these values as needed)
    let needleWidth = 80;
    let needleHeight = 100;
    
    imageMode(CENTER);
    image(needleImg, 0, 0, needleWidth, needleHeight);
  } else {
    // Fallback to programmatic drawing if image fails to load
    stroke('#c0c0c0'); // silver color
    strokeWeight(3);
    fill('#c0c0c0');
    
    // Needle shaft
    line(-30, 0, 30, 0);
    
    // Needle point
    fill('#888');
    noStroke();
    triangle(30, 0, 40, -2, 40, 2);
    
    // Needle eye
    fill('#c0c0c0');
    stroke('#888');
    strokeWeight(1);
    ellipse(-25, 0, 8, 8);
    fill('#333');
    noStroke();
    ellipse(-25, 0, 3, 3);
  }
  
  pop();
}

function mousePressed() {
  mouseDownTime = millis(); // Record when mouse was pressed
  
  if (needleFollowsMouse) {
    // Start tracking drag for sewing
    isDragging = true;
    dragStartX = mouseX;
    dragStartY = mouseY;
    dragPath = [{x: mouseX, y: mouseY}]; // Initialize drag path
  }
}

function mouseDragged() {
  if (isDragging) {
    // Add current position to drag path
    dragPath.push({x: mouseX, y: mouseY});
  }
}

function enableNeedleFollow() {
  needleFollowsMouse = true;
  document.body.style.cursor = 'none'; // Hide cursor
  console.log("ESC mode disabled - needle now follows mouse");
}

function calculateDragDistance(path) {
  let distance = 0;
  for (let i = 1; i < path.length; i++) {
    distance += dist(path[i - 1].x, path[i - 1].y, path[i].x, path[i].y);
  }
  return distance;
}

function trySewStitches() {
  let stitchedAny = false;

  for (let s of stitches) {
    if (!s.done && totalThread > 0 && didNeedleGoThroughStitch(s)) {
      // Sew stitch
      s.done = true;
      usedStitches++;
      totalThread -= 20;
      sewnPath.push({ x: s.x, y: s.y });
      stitchedAny = true;

      console.log("Stitch sewn by dragging through, total stitches:", usedStitches);
    }
  }

  // Check completion
  if (usedStitches === stitches.length) {
    heartCompleted = true;
  }

  return stitchedAny;
}

function resetDragTracking() {
  isDragging = false;
  dragPath = [];
}

function mouseReleased() {
  if (!needleFollowsMouse) {
    enableNeedleFollow();
    return;
  }

  // Needle follows mouse → check for drag sewing
  if (isDragging) {
    const dragDistance = calculateDragDistance(dragPath);

    if (dragDistance >= dragMinDistance) {
      const stitchedAny = trySewStitches();

      if (!stitchedAny) {
        console.log(
          "Dragged", Math.round(dragDistance), 
          "pixels, but didn't go through any stitch"
        );
      }
    }
  }

  resetDragTracking();
}

function keyPressed() {
  if (key === 'Escape') {
    if (needleFollowsMouse) {
      // Fix needle at current position and show mouse cursor
      fixedNeedleX = mouseX;
      fixedNeedleY = mouseY;
      needleFollowsMouse = false;
      document.body.style.cursor = 'default'; // Show mouse cursor
    } else {
      // Resume following mouse and hide cursor
      needleFollowsMouse = true;
      document.body.style.cursor = 'none'; // Hide mouse cursor
    }
  }
}

function getNeedleEyePosition(needleX, needleY) {
  // Calculate the position of the needle's eye (where thread should attach)
  
  // The needle eye is at the back end of the needle
  // Since the needle image is 80 pixels wide and centered, the eye is about 35-40 pixels back
  let eyeOffset = -35; // Distance from center to eye (negative = towards the back)
  
  // Calculate eye position based on needle rotation
  let eyeX = needleX + cos(needleAngle) * eyeOffset;
  let eyeY = needleY + sin(needleAngle) * eyeOffset;
  
  return { x: eyeX, y: eyeY };
}

function didNeedleGoThroughStitch(stitch) {
  let stitchRadius = 15;
  
  // Check each segment of the drag path
  for (let i = 1; i < dragPath.length; i++) {
    let p1 = dragPath[i-1];
    let p2 = dragPath[i];
    
    let distToStitch = distanceToLineSegment(stitch.x, stitch.y, p1.x, p1.y, p2.x, p2.y);
    
    if (distToStitch <= stitchRadius) {
      return true;
    }
  }
  
  return false;
}

function distanceToLineSegment(px, py, x1, y1, x2, y2) {
  // Calculate distance from point (px, py) to line segment (x1, y1) to (x2, y2)
  let dx = x2 - x1;
  let dy = y2 - y1;
  let length = sqrt(dx * dx + dy * dy);
  
  if (length === 0) {
    // Line segment is actually a point
    return dist(px, py, x1, y1);
  }
  
  // Calculate parameter t for closest point on line segment
  let t = ((px - x1) * dx + (py - y1) * dy) / (length * length);
  t = constrain(t, 0, 1); // Clamp to line segment
  
  // Find closest point on line segment
  let closestX = x1 + t * dx;
  let closestY = y1 + t * dy;
  
  // Return distance to closest point
  return dist(px, py, closestX, closestY);
}

function getThreadAnchor() {
  if (sewnPath.length > 0) {
    // Anchor from first sewn stitch
    return { x: sewnPath[0].x, y: sewnPath[0].y };
  } else {
    // Anchor from needle eye (cursor is at tip, so calculate center first)
    let tipX = needleFollowsMouse ? mouseX : fixedNeedleX;
    let tipY = needleFollowsMouse ? mouseY : fixedNeedleY;
    let { x: centerX, y: centerY } = getNeedleCenterFromTip(tipX, tipY);
    return getNeedleEyePosition(centerX, centerY);
  }
}

function applyPhysics(segment) {
  // Store previous
  let tempX = segment.x;
  let tempY = segment.y;

  // Verlet integration with damping + gravity
  segment.x += (segment.x - segment.prevX) * 0.6;
  segment.y += (segment.y - segment.prevY) * 0.6;
  segment.y += 0.4; // gravity

  // Update previous position
  segment.prevX = tempX;
  segment.prevY = tempY;
}

function constrainSegment(segment, targetX, targetY) {
  let dx = targetX - segment.x;
  let dy = targetY - segment.y;
  let distance = sqrt(dx * dx + dy * dy);

  if (distance > segmentLength) {
    segment.x = targetX - (dx / distance) * segmentLength;
    segment.y = targetY - (dy / distance) * segmentLength;
  }
}

function updateThreadPhysics() {
  const anchor = getThreadAnchor();

  for (let i = 0; i < threadSegments.length; i++) {
    let segment = threadSegments[i];

    applyPhysics(segment);

    if (i === 0) {
      // First segment constrained to anchor
      constrainSegment(segment, anchor.x, anchor.y);
    } else {
      // Constrain to previous segment
      let prev = threadSegments[i - 1];
      constrainSegment(segment, prev.x, prev.y);
    }
  }
}

function drawDanglingThread(startX, startY) {
  let { endX, endY } = drawThreadSegments(startX, startY, numThreadSegments);

  // Check if we need to connect back to needle
  let tipX = needleFollowsMouse ? mouseX : fixedNeedleX;
  let tipY = needleFollowsMouse ? mouseY : fixedNeedleY;
  let { x: centerX, y: centerY } = getNeedleCenterFromTip(tipX, tipY);
  let eyePos = getNeedleEyePosition(centerX, centerY);

  if (startX !== eyePos.x || startY !== eyePos.y) {
    line(endX, endY, eyePos.x, eyePos.y);
  }
}

function drawPureDanglingThread(startX, startY) {
  // Progress ratio
  let totalStitches = stitches.length;
  let stitchesRemaining = totalStitches - usedStitches;
  let threadProgress = stitchesRemaining / totalStitches;

  // Segment count + partial
  let exactSegmentsToShow = threadProgress * numThreadSegments;
  let fullSegmentsToShow = Math.floor(exactSegmentsToShow);
  let partialRatio = exactSegmentsToShow - fullSegmentsToShow;

  // Draw truncated thread (no needle connection)
  drawThreadSegments(startX, startY, fullSegmentsToShow, partialRatio);
}

function drawThreadSegments(startX, startY, segmentsToDraw, partialRatio = 0) {
  let prevX = startX;
  let prevY = startY;

  stroke("red");
  strokeWeight(2);

  // Draw full segments
  for (let i = 0; i < segmentsToDraw; i++) {
    let segment = threadSegments[i];
    line(prevX, prevY, segment.x, segment.y);
    prevX = segment.x;
    prevY = segment.y;
  }

  // Draw partial segment if needed
  if (partialRatio > 0 && segmentsToDraw < numThreadSegments) {
    let segment = threadSegments[segmentsToDraw];
    let partialX = lerp(prevX, segment.x, partialRatio);
    let partialY = lerp(prevY, segment.y, partialRatio);
    line(prevX, prevY, partialX, partialY);

    prevX = partialX;
    prevY = partialY;
  }

  return { endX: prevX, endY: prevY }; // Return final position
}
